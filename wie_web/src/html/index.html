<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>소울카드마스터2</title>
    <link rel="stylesheet" href="@css/style.css" />
    <script src="@ts/index.ts" defer="defer"></script>
  </head>
  <body>
    <main class="scm2-app">
      <header class="scm2-header">
        <span id="status">준비 중…</span>
        <div class="scm2-header-actions">
          <img class="scm2-brand-icon" src="scm2-icon.png" alt="소울카드마스터2" />
          <button id="settings-toggle" class="settings-toggle" aria-label="설정">⚙</button>
        </div>
      </header>

      <div class="canvas-wrapper">
        <canvas id="canvas" width="240" height="320"></canvas>
        <div id="settings-panel" class="settings-panel">
          <label>🎵 MIDI <input type="range" id="volume-midi" min="0" max="100" value="50" /></label>
          <label>🔊 효과음 <input type="range" id="volume-pcm" min="0" max="100" value="50" /></label>
        </div>
      </div>

      <section class="button-container" aria-label="게임 키패드">
        <div class="nav-pad" aria-label="방향 및 확인 키">
          <button data-key="UP" class="key-up">▲</button>
          <button data-key="LEFT" class="key-left">◀</button>
          <button data-key="OK" class="key-ok">OK</button>
          <button data-key="RIGHT" class="key-right">▶</button>
          <button data-key="DOWN" class="key-down">▼</button>
          <button data-key="CLR" class="key-clr">CLR</button>
        </div>

        <div class="number-pad" aria-label="숫자 키">
          <button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button>
          <button data-key="4">4</button><button data-key="5">5</button><button data-key="6">6</button>
          <button data-key="7">7</button><button data-key="8">8</button><button data-key="9">9</button>
          <button data-key="*">*</button><button data-key="0">0</button><button data-key="#">#</button>
        </div>
      </section>
    </main>
  </body>
</html>
